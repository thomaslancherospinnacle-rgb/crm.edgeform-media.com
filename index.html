// ║  EDGEFORM CRM — PIPELINE VIEW (Kanban)                         ║
// ║  Drag-and-drop deal board across pipeline stages                ║
// ╚══════════════════════════════════════════════════════════════════╝

const Pipeline = (() => {
  let deals = [];

  async function render() {
    const view = App.getMainView();
    view.innerHTML = `
      <div class="view-header">
        <h1>Pipeline</h1>
        <div class="view-actions">
          <button class="btn btn-ghost btn-sm" onclick="Pipeline.refresh()"><i data-feather="refresh-cw"></i></button>
          <button class="btn btn-primary btn-sm" onclick="Deals.showCreateModal()"><i data-feather="plus"></i> New Deal</button>
        </div>
      </div>
      <div class="pipeline-summary" id="pipeline-summary"></div>
      <div class="kanban-board" id="kanban-board">
        ${CONFIG.PIPELINE_STAGES.map(stage => `
          <div class="kanban-column" data-stage="${stage.id}"
               ondragover="Pipeline.onDragOver(event)"
               ondrop="Pipeline.onDrop(event, '${stage.id}')">
            <div class="kanban-header" style="--stage-color:${stage.color}">
              <span class="kanban-title"><i data-feather="${stage.icon}"></i> ${stage.label}</span>
              <span class="kanban-count" id="count-${stage.id}">0</span>
            </div>
            <div class="kanban-cards" id="cards-${stage.id}">
              <div class="loading-skeleton"></div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    feather.replace();
    await loadDeals();
  }

  async function loadDeals() {
    const res = await API.getDeals();
    if (res.ok) {
      deals = res.deals || [];
      renderCards();
      renderSummary();
    }
  }

  function renderCards() {
    CONFIG.PIPELINE_STAGES.forEach(stage => {
      const container = document.getElementById(`cards-${stage.id}`);
      const countEl = document.getElementById(`count-${stage.id}`);
      const stageDeals = deals.filter(d => d.stage === stage.id);

      if (countEl) countEl.textContent = stageDeals.length;
      if (!container) return;

      if (!stageDeals.length) {
        container.innerHTML = '<div class="kanban-empty">No deals</div>';
        return;
      }

      container.innerHTML = stageDeals.map(deal => `
        <div class="kanban-card" draggable="true"
             ondragstart="Pipeline.onDragStart(event, '${deal.id}')"
             onclick="Deals.openDetail('${deal.id}')">
          <div class="card-title">${deal.title || deal.leadName || 'Untitled'}</div>
          <div class="card-value">${deal.value ? '$' + Number(deal.value).toLocaleString() : '—'}</div>
          <div class="card-meta">
            <span>${deal.leadName || ''}</span>
            ${deal.expectedClose ? `<span>${Utils.formatDate(deal.expectedClose)}</span>` : ''}
          </div>
          <div class="card-owner">
            <div class="mini-avatar">${(deal.ownerName || 'U')[0]}</div>
            <span>${deal.ownerName || 'Unassigned'}</span>
          </div>
        </div>
      `).join('');
    });
  }

  function renderSummary() {
    const el = document.getElementById('pipeline-summary');
    if (!el) return;
    const totalValue = deals.filter(d => d.stage !== 'closed_lost').reduce((s, d) => s + (Number(d.value) || 0), 0);
    const wonValue = deals.filter(d => d.stage === 'closed_won').reduce((s, d) => s + (Number(d.value) || 0), 0);
    const activeDeals = deals.filter(d => !d.stage.startsWith('closed_')).length;

    el.innerHTML = `
      <div class="summary-item"><span class="summary-value">$${totalValue.toLocaleString()}</span><span class="summary-label">Pipeline Value</span></div>
      <div class="summary-item"><span class="summary-value">$${wonValue.toLocaleString()}</span><span class="summary-label">Won</span></div>
      <div class="summary-item"><span class="summary-value">${activeDeals}</span><span class="summary-label">Active Deals</span></div>
      <div class="summary-item"><span class="summary-value">${deals.length}</span><span class="summary-label">Total Deals</span></div>
    `;
  }

  // ── Drag & Drop ──────────────────────────────────────────────
  let draggedDealId = null;

  function onDragStart(e, dealId) {
    draggedDealId = dealId;
    e.dataTransfer.effectAllowed = 'move';
    e.target.classList.add('dragging');
  }

  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    e.currentTarget.classList.add('drag-over');
  }

  function onDrop(e, newStage) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));

    if (!draggedDealId) return;
    const deal = deals.find(d => d.id === draggedDealId);
    if (!deal || deal.stage === newStage) return;

    const oldStage = deal.stage;
    deal.stage = newStage;
    renderCards();

    // Update server
    API.moveDealStage(draggedDealId, newStage).then(res => {
      if (res.ok) {
        const stageLabel = CONFIG.PIPELINE_STAGES.find(s => s.id === newStage)?.label || newStage;
        App.toast(`Deal moved to ${stageLabel}`, 'success');
        renderSummary();
      } else {
        deal.stage = oldStage;
        renderCards();
        App.toast('Failed to update stage', 'error');
      }
    });
    draggedDealId = null;
  }

  function refresh() { render(); }

  return { render, refresh, onDragStart, onDragOver, onDrop, loadDeals };
})();

const Tasks = (() => {
  let allTasks = [];
  let filter = 'pending';

  async function render() {
    const view = App.getMainView();
    view.innerHTML = `
      <div class="view-header">
        <h1>Tasks</h1>
        <div class="view-actions">
          <button class="btn btn-primary btn-sm" onclick="Tasks.showCreateModal()"><i data-feather="plus"></i> New Task</button>
        </div>
      </div>
      <div class="filters-bar">
        <div class="tab-filters">
          <button class="tab-filter ${filter==='pending'?'active':''}" onclick="Tasks.setFilter('pending')">Pending</button>
          <button class="tab-filter ${filter==='overdue'?'active':''}" onclick="Tasks.setFilter('overdue')">Overdue</button>
          <button class="tab-filter ${filter==='today'?'active':''}" onclick="Tasks.setFilter('today')">Due Today</button>
          <button class="tab-filter ${filter==='completed'?'active':''}" onclick="Tasks.setFilter('completed')">Completed</button>
          <button class="tab-filter ${filter==='all'?'active':''}" onclick="Tasks.setFilter('all')">All</button>
        </div>
      </div>
      <div class="tasks-list" id="tasks-list"><div class="loading-skeleton"></div></div>
    `;
    feather.replace();
    await loadTasks();
  }

  async function loadTasks() {
    const res = await API.getTasks({});
    if (res.ok) { allTasks = res.tasks || []; renderTasks(); }
  }

  function setFilter(f) { filter = f; renderTasks(); 
    document.querySelectorAll('.tab-filter').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().replace(' ','') === f || (b.textContent === 'Due Today' && f === 'today')));
  }

  function renderTasks() {
    const el = document.getElementById('tasks-list');
    if (!el) return;
    const now = new Date();
    const todayStr = now.toISOString().slice(0,10);

    let filtered = allTasks;
    if (filter === 'pending') filtered = allTasks.filter(t => !t.completed);
    else if (filter === 'overdue') filtered = allTasks.filter(t => !t.completed && t.dueDate && t.dueDate < todayStr);
    else if (filter === 'today') filtered = allTasks.filter(t => t.dueDate && t.dueDate.startsWith(todayStr));
    else if (filter === 'completed') filtered = allTasks.filter(t => t.completed);

    if (!filtered.length) { el.innerHTML = '<div class="empty-state">No tasks found</div>'; return; }

    filtered.sort((a, b) => (a.dueDate || 'z').localeCompare(b.dueDate || 'z'));

    el.innerHTML = filtered.map(t => {
      const overdue = !t.completed && t.dueDate && t.dueDate < todayStr;
      return `
        <div class="task-card ${t.completed ? 'task-done' : ''} ${overdue ? 'task-overdue' : ''}">
          <button class="task-check" onclick="Tasks.complete('${t.id}')">
            <i data-feather="${t.completed ? 'check-square' : 'square'}"></i>
          </button>
          <div class="task-content">
            <div class="task-title">${t.title}</div>
            <div class="task-meta">
              ${t.leadName ? `<span class="task-lead" onclick="Leads.openDetail('${t.leadId}')">${t.leadName}</span>` : ''}
              ${t.dueDate ? `<span class="${overdue ? 'text-danger' : ''}">${Utils.formatDate(t.dueDate)}</span>` : ''}
              ${t.assigneeName ? `<span>→ ${t.assigneeName}</span>` : ''}
            </div>
          </div>
          <div class="task-actions">
            <button class="btn-icon" onclick="Tasks.showEditModal('${t.id}')"><i data-feather="edit-2"></i></button>
          </div>
        </div>
      `;
    }).join('');
    feather.replace();
  }

  async function complete(taskId) {
    const task = allTasks.find(t => t.id === taskId);
    if (!task) return;
    task.completed = !task.completed;
    renderTasks();
    const res = await API.updateTask(taskId, { completed: task.completed });
    if (res.ok) App.toast(task.completed ? 'Task completed' : 'Task reopened', 'success');
  }

  function showCreateModal(prefill = {}) {
    App.openModal('New Task', taskFormHTML(prefill));
  }

  function showEditModal(id) {
    const task = allTasks.find(t => t.id === id);
    if (task) App.openModal('Edit Task', taskFormHTML(task));
  }

  function taskFormHTML(task = {}) {
    return `
      <form id="task-form" class="form-grid" onsubmit="return false">
        <div class="form-group full-width"><label>Task Title *</label><input name="title" value="${task.title||''}" required></div>
        <div class="form-group"><label>Due Date</label><input type="datetime-local" name="dueDate" value="${task.dueDate||''}"></div>
        <div class="form-group"><label>Related Lead</label><input name="leadName" value="${task.leadName||''}" placeholder="Lead name"></div>
        <div class="form-group full-width"><label>Notes</label><textarea name="notes" rows="3">${task.notes||''}</textarea></div>
        <div class="form-actions full-width">
          <button class="btn btn-ghost" type="button" onclick="App.closeModal()">Cancel</button>
          <button class="btn btn-primary" type="button" onclick="Tasks.saveTask('${task.id||''}')">${task.id?'Update':'Create'}</button>
        </div>
      </form>`;
  }

  async function saveTask(existingId) {
    const data = Object.fromEntries(new FormData(document.getElementById('task-form')));
    if (!data.title) { App.toast('Title required','error'); return; }
    const res = existingId ? await API.updateTask(existingId, data) : await API.createTask(data);
    if (res.ok) { App.toast('Saved','success'); App.closeModal(); loadTasks(); }
  }

  return { render, setFilter, complete, showCreateModal, showEditModal, saveTask, loadTasks };
})();

      { name: 'Thank You', subject: 'Welcome aboard, {{name}}!', body: 'Hi {{name}},\n\nThank you for choosing Edgeform Media for your website project! We\'re excited to bring your vision to life.\n\nHere\'s what happens next:\n- We\'ll schedule a discovery call to discuss your requirements\n- Our team will create initial design concepts\n- You\'ll review and provide feedback\n\nLooking forward to working with you!\n\nBest regards' }
    ];

    return templates.map(t => `
      <div class="template-card" onclick="Email.useTemplate(${JSON.stringify(t).replace(/"/g,'&quot;')})">
        <div class="template-name">${t.name}</div>
        <div class="template-preview">${t.body.substring(0, 60)}...</div>
      </div>
    `).join('');
  }

  function useTemplate(template) {
    document.getElementById('email-subject').value = template.subject;
    document.getElementById('email-body').innerHTML = template.body.replace(/\n/g, '<br>');
  }

  function composeForLead(leadId) {
    // Called from lead detail panel
    App.navigate('email');
    // Could prefill with lead data if we had it cached
  }

  function format(cmd) {
    document.execCommand(cmd, false, null);
    document.getElementById('email-body').focus();
  }

  function insertTemplate() {
    // Show template picker
  }

  async function send() {
    const to = document.getElementById('email-to')?.value;
    const subject = document.getElementById('email-subject')?.value;
    const body = document.getElementById('email-body')?.innerHTML;

    if (!to || !subject) { App.toast('To and Subject are required', 'error'); return; }

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.innerHTML = '<i data-feather="loader"></i> Sending...';
    feather.replace();

    try {
      const res = await API.sendEmail(to, subject, body);
      if (res.ok) {
        App.toast('Email sent successfully', 'success');
        clear();
      } else {
        App.toast(res.error || 'Failed to send', 'error');
      }
    } catch (err) {
      App.toast('Email send failed', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i data-feather="send"></i> Send Email';
      feather.replace();
    }
  }

  function clear() {
    const to = document.getElementById('email-to');
    const subject = document.getElementById('email-subject');
    const body = document.getElementById('email-body');
    if (to) to.value = '';
    if (subject) subject.value = '';
    if (body) body.innerHTML = '';
  }

  return { render, send, clear, format, useTemplate, composeForLead, insertTemplate };
})();

// ╚══════════════════════════════════════════════════════════════════╝

const Reports = (() => {

  async function render() {
    const view = App.getMainView();
    view.innerHTML = `
      <div class="view-header">
        <h1>Reports</h1>
        <div class="view-actions">
          <select id="report-range" class="filter-select" onchange="Reports.refresh()">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="365">Last year</option>
          </select>
        </div>
      </div>
      <div class="reports-grid">
        <div class="card"><div class="card-header"><h3>Conversion Funnel</h3></div><div class="card-body" id="report-funnel"><div class="loading-skeleton"></div></div></div>
        <div class="card"><div class="card-header"><h3>Leads by Source</h3></div><div class="card-body" id="report-sources"><div class="loading-skeleton"></div></div></div>
        <div class="card"><div class="card-header"><h3>Pipeline Value by Stage</h3></div><div class="card-body" id="report-pipeline"><div class="loading-skeleton"></div></div></div>
        <div class="card"><div class="card-header"><h3>Agent Performance</h3></div><div class="card-body" id="report-agents"><div class="loading-skeleton"></div></div></div>
        <div class="card full-width"><div class="card-header"><h3>Lead Activity (Last 30 Days)</h3></div><div class="card-body" id="report-activity"><div class="loading-skeleton"></div></div></div>
      </div>
    `;
    feather.replace();
    await loadReports();
  }

  async function loadReports() {
    const days = parseInt(document.getElementById('report-range')?.value || 30);
    const after = new Date(Date.now() - days * 86400000).toISOString();
    const [conv, src, pipe, agents] = await Promise.all([
      API.getConversionReport({ after }),
      API.getLeadsBySource(),
      API.getPipelineValue(),
      API.getAgentPerformance()
    ]);

    if (conv.ok) renderFunnel(conv);
    if (src.ok) renderSources(src.sources || []);
    if (pipe.ok) renderPipelineValue(pipe.stages || []);
    if (agents.ok) renderAgents(agents.agents || []);
  }

  function renderFunnel(data) {
    const el = document.getElementById('report-funnel');
    if (!el) return;
    const stages = [
      { label: 'Total Leads', value: data.total || 0, color: '#6366f1' },
      { label: 'Contacted', value: data.contacted || 0, color: '#f59e0b' },
      { label: 'Qualified', value: data.qualified || 0, color: '#3b82f6' },
      { label: 'Converted', value: data.converted || 0, color: '#10b981' },
    ];
    const max = stages[0].value || 1;
    el.innerHTML = `<div class="funnel">${stages.map(s => {
      const pct = Math.round(s.value / max * 100);
      return `<div class="funnel-stage">
        <div class="funnel-bar" style="width:${Math.max(pct, 5)}%;background:${s.color}">
          <span class="funnel-value">${s.value}</span>
        </div>
        <span class="funnel-label">${s.label} (${pct}%)</span>
      </div>`;
    }).join('')}</div>`;
  }

  function renderSources(sources) {
    const el = document.getElementById('report-sources');
    if (!el || !sources.length) { if (el) el.innerHTML = '<div class="empty-state">No data</div>'; return; }
    const max = Math.max(...sources.map(s => s.count));
    const colors = ['#6366f1','#f59e0b','#10b981','#ef4444','#3b82f6','#8b5cf6','#ec4899','#14b8a6'];
    el.innerHTML = `<div class="bar-chart">${sources.map((s, i) => `
      <div class="bar-row">
        <div class="bar-label">${s.source}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${s.count/max*100}%;background:${colors[i%colors.length]}"></div></div>
        <div class="bar-value">${s.count}</div>
      </div>
    `).join('')}</div>`;
  }

  function renderPipelineValue(stages) {
    const el = document.getElementById('report-pipeline');
    if (!el || !stages.length) { if (el) el.innerHTML = '<div class="empty-state">No data</div>'; return; }
    const max = Math.max(...stages.map(s => s.value));
    el.innerHTML = `<div class="bar-chart">${stages.map(s => {
      const cfg = CONFIG.PIPELINE_STAGES.find(p => p.id === s.stage) || { label: s.stage, color: '#6366f1' };
      return `<div class="bar-row">
        <div class="bar-label">${cfg.label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${max?s.value/max*100:0}%;background:${cfg.color}"></div></div>
        <div class="bar-value">$${Number(s.value).toLocaleString()}</div>
      </div>`;
    }).join('')}</div>`;
  }

  function renderAgents(agents) {
    const el = document.getElementById('report-agents');
    if (!el || !agents.length) { if (el) el.innerHTML = '<div class="empty-state">No data</div>'; return; }
    el.innerHTML = `<div class="agent-leaderboard">
      ${agents.sort((a,b) => (b.closed||0) - (a.closed||0)).map((a, i) => `
        <div class="agent-row">
          <div class="agent-rank">#${i+1}</div>
          <div class="agent-avatar">${(a.name||'?')[0]}</div>
          <div class="agent-info">
            <div class="agent-name">${a.name}</div>
            <div class="agent-stats">${a.leads||0} leads · ${a.closed||0} closed · $${(a.revenue||0).toLocaleString()}</div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  function refresh() { loadReports(); }

  return { render, refresh };
})();

const Team = (() => {
  let users = [];

  async function render() {
    const view = App.getMainView();
    view.innerHTML = `
      <div class="view-header">
        <h1>Team Management</h1>
        <div class="view-actions">
          ${Auth.hasRole('admin') ? '<button class="btn btn-primary btn-sm" onclick="Team.showInviteModal()"><i data-feather="user-plus"></i> Add User</button>' : ''}
        </div>
      </div>
      <div class="team-grid" id="team-grid"><div class="loading-skeleton"></div></div>
    `;
    feather.replace();
    await loadUsers();
  }

  async function loadUsers() {
    const res = await Auth.getAllUsers();
    if (res.ok) { users = res.users || []; renderUsers(); }
  }

  function renderUsers() {
    const el = document.getElementById('team-grid');
    if (!el) return;
    if (!users.length) { el.innerHTML = '<div class="empty-state">No team members yet</div>'; return; }
    el.innerHTML = users.map(u => `
      <div class="team-card">
        <div class="team-avatar" style="background:${roleColor(u.role)}">${(u.name||'?')[0].toUpperCase()}</div>
        <div class="team-info">
          <div class="team-name">${u.name}</div>
          <div class="team-email">${u.email}</div>
          <span class="status-badge" style="--badge-color:${roleColor(u.role)}">${u.role}</span>
        </div>
        ${Auth.hasRole('admin') ? `
        <div class="team-actions">
          <button class="btn-icon" onclick="Team.editUser('${u.id}')" title="Edit"><i data-feather="edit-2"></i></button>
          <button class="btn-icon text-danger" onclick="Team.removeUser('${u.id}')" title="Remove"><i data-feather="trash-2"></i></button>
        </div>` : ''}
      </div>
    `).join('');
    feather.replace();
  }

  function roleColor(role) {
    return { admin: '#ef4444', manager: '#f59e0b', agent: '#3b82f6' }[role] || '#6366f1';
  }

  function showInviteModal() {
    App.openModal('Add Team Member', `
      <form id="invite-form" class="form-grid" onsubmit="return false">
        <div class="form-group"><label>Full Name *</label><input name="name" required></div>
        <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password *</label><input type="password" name="password" required minlength="6"></div>
        <div class="form-group"><label>Role</label>
          <select name="role">
            <option value="agent">Agent</option>
            <option value="manager">Manager</option>
            ${Auth.hasRole('admin') ? '<option value="admin">Admin</option>' : ''}
          </select>
        </div>
        <div class="form-actions full-width">
          <button class="btn btn-ghost" type="button" onclick="App.closeModal()">Cancel</button>
          <button class="btn btn-primary" type="button" onclick="Team.createUser()">Create Account</button>
        </div>
      </form>
    `);
  }

  async function createUser() {
    const data = Object.fromEntries(new FormData(document.getElementById('invite-form')));
    if (!data.name || !data.email || !data.password) { App.toast('All fields required', 'error'); return; }
    const res = await Auth.register(data.name, data.email, data.password, data.role);
    if (res.ok) { App.toast('User created', 'success'); App.closeModal(); loadUsers(); }
    else App.toast(res.error || 'Failed', 'error');
  }

  function editUser(id) {
    const user = users.find(u => u.id === id);
    if (!user) return;
    App.openModal('Edit User', `
      <form id="edit-user-form" class="form-grid" onsubmit="return false">
        <div class="form-group"><label>Name</label><input name="name" value="${user.name}"></div>
        <div class="form-group"><label>Email</label><input name="email" value="${user.email}" readonly class="input-readonly"></div>
        <div class="form-group"><label>Role</label>
          <select name="role">
            <option value="agent" ${user.role==='agent'?'selected':''}>Agent</option>
            <option value="manager" ${user.role==='manager'?'selected':''}>Manager</option>
            <option value="admin" ${user.role==='admin'?'selected':''}>Admin</option>
          </select>
        </div>
        <div class="form-group"><label>New Password (leave blank to keep)</label><input type="password" name="password"></div>
        <div class="form-actions full-width">
          <button class="btn btn-ghost" type="button" onclick="App.closeModal()">Cancel</button>
          <button class="btn btn-primary" type="button" onclick="Team.saveUser('${id}')">Save</button>
        </div>
      </form>
    `);
  }

  async function saveUser(id) {
    const data = Object.fromEntries(new FormData(document.getElementById('edit-user-form')));
    if (!data.password) delete data.password;
    const res = await Auth.updateUser(id, data);
    if (res.ok) { App.toast('Updated', 'success'); App.closeModal(); loadUsers(); }
  }

  function removeUser(id) {
    const user = users.find(u => u.id === id);
    App.confirm(`Remove ${user?.name || 'this user'}?`, async () => {
      const res = await Auth.deleteUser(id);
      if (res.ok) { App.toast('User removed', 'success'); loadUsers(); }
    });
  }

  return { render, showInviteModal, createUser, editUser, saveUser, removeUser };
})();

// ╔══════════════════════════════════════════════════════════════════╗
// ║  EDGEFORM CRM — APP SHELL & ROUTER                             ║
// ║  Navigation, view rendering, modal system, toast notifications  ║
// ╚══════════════════════════════════════════════════════════════════╝

const App = (() => {
  let currentView = 'dashboard';
  let sidebarCollapsed = false;

  // ── Toast Notifications ────────────────────────────────────────
  function toast(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    const icons = { success: 'check-circle', error: 'alert-circle', info: 'info', warning: 'alert-triangle' };
    el.innerHTML = `<i data-feather="${icons[type] || 'info'}"></i><span>${message}</span>`;
    container.appendChild(el);
    feather.replace({ width: 16, height: 16 });
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, duration);
  }

  // ── Modal System ───────────────────────────────────────────────
  function openModal(title, contentHTML, opts = {}) {
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal');
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = contentHTML;
    if (opts.wide) modal.classList.add('modal-wide');
    else modal.classList.remove('modal-wide');
    overlay.classList.remove('hidden');
    modal.classList.remove('hidden');
    requestAnimationFrame(() => {
      overlay.classList.add('show');
      modal.classList.add('show');
    });
    if (opts.onOpen) setTimeout(opts.onOpen, 50);
  }

  function closeModal() {
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal');
    overlay.classList.remove('show');
    modal.classList.remove('show');
    setTimeout(() => {
      overlay.classList.add('hidden');
      modal.classList.add('hidden');
    }, 300);
  }

  // ── Confirm Dialog ─────────────────────────────────────────────
  function confirm(message, onConfirm) {
    openModal('Confirm', `
      <p style="margin-bottom:24px;color:var(--text-secondary)">${message}</p>
      <div style="display:flex;gap:12px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="App.closeModal()">Cancel</button>
        <button class="btn btn-danger" id="confirm-yes">Confirm</button>
      </div>
    `);
    setTimeout(() => {
      document.getElementById('confirm-yes').onclick = () => { App.closeModal(); onConfirm(); };
    }, 50);
  }

  // ── Slide Panel (Lead Detail) ──────────────────────────────────
  function openPanel(contentHTML) {
    const panel = document.getElementById('detail-panel');
    const overlay = document.getElementById('panel-overlay');
    document.getElementById('panel-content').innerHTML = contentHTML;
    panel.classList.add('open');
    overlay.classList.add('show');
    feather.replace();
  }

  function closePanel() {
    document.getElementById('detail-panel').classList.remove('open');
    document.getElementById('panel-overlay').classList.remove('show');
  }

  // ── Navigation ─────────────────────────────────────────────────
  const views = {
    dashboard:  { label: 'Dashboard',  icon: 'grid',          render: () => Dashboard.render() },
    leads:      { label: 'Leads',      icon: 'users',         render: () => Leads.render() },
    pipeline:   { label: 'Pipeline',   icon: 'git-branch',    render: () => Pipeline.render() },
    deals:      { label: 'Deals',      icon: 'dollar-sign',   render: () => Deals.render() },
    tasks:      { label: 'Tasks',      icon: 'check-square',  render: () => Tasks.render() },
    email:      { label: 'Email',      icon: 'mail',          render: () => Email.render() },
    reports:    { label: 'Reports',    icon: 'bar-chart-2',   render: () => Reports.render() },
    team:       { label: 'Team',       icon: 'briefcase',     render: () => Team.render(), role: 'manager' },
    settings:   { label: 'Settings',   icon: 'settings',      render: () => Settings.render() },
  };

  function navigate(viewId) {
    if (!views[viewId]) return;
    if (views[viewId].role && !Auth.hasRole(views[viewId].role)) {
      toast('Access denied', 'error');
      return;
    }
    currentView = viewId;
    // Update sidebar active state
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.view === viewId);
    });
    // Render the view
    views[viewId].render();
    // Update URL hash
    window.location.hash = viewId;
    // Close mobile sidebar
    if (window.innerWidth < 1024) toggleSidebar(true);
  }

  function toggleSidebar(forceClose = false) {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if (forceClose) {
      sidebar.classList.remove('mobile-open');
      overlay.classList.remove('show');
    } else {
      sidebar.classList.toggle('mobile-open');
      overlay.classList.toggle('show');
    }
  }

  // ── Build Shell ────────────────────────────────────────────────
  function buildShell() {
    const user = Auth.currentUser();
    const app = document.getElementById('app');
    app.innerHTML = `
      <!-- Sidebar Overlay (mobile) -->
      <div id="sidebar-overlay" class="sidebar-overlay" onclick="App.toggleSidebar(true)"></div>

      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-icon">E</div>
            <span class="logo-text">Edgeform</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          ${Object.entries(views).map(([id, v]) => {
            if (v.role && !Auth.hasRole(v.role)) return '';
            return `<a class="nav-item ${id === currentView ? 'active' : ''}" data-view="${id}" onclick="App.navigate('${id}')">
              <i data-feather="${v.icon}"></i>
              <span>${v.label}</span>
            </a>`;
          }).join('')}
        </nav>
        <div class="sidebar-footer">
          <div class="user-badge">
            <div class="user-avatar">${(user?.name || 'U')[0].toUpperCase()}</div>
            <div class="user-info">
              <div class="user-name">${user?.name || 'User'}</div>
              <div class="user-role">${user?.role || 'agent'}</div>
            </div>
            <button class="btn-icon" onclick="Auth.logout()" title="Logout">
              <i data-feather="log-out"></i>
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="topbar">
          <button class="btn-icon mobile-menu" onclick="App.toggleSidebar()">
            <i data-feather="menu"></i>
          </button>
          <div class="topbar-search">
            <i data-feather="search"></i>
            <input type="text" placeholder="Search leads, deals, contacts..." id="global-search" oninput="App.globalSearch(this.value)">
          </div>
          <div class="topbar-actions">
            <button class="btn btn-primary btn-sm" onclick="Leads.showCreateModal()">
              <i data-feather="plus"></i> New Lead
            </button>
          </div>
        </header>
        <div id="main-view" class="main-view"></div>
      </main>

      <!-- Detail Panel (slide-out) -->
      <div id="panel-overlay" class="panel-overlay" onclick="App.closePanel()"></div>
      <aside id="detail-panel" class="detail-panel">
        <div class="panel-header">
          <button class="btn-icon" onclick="App.closePanel()"><i data-feather="x"></i></button>
        </div>
        <div id="panel-content" class="panel-body"></div>
      </aside>

      <!-- Modal -->
      <div id="modal-overlay" class="modal-overlay hidden" onclick="App.closeModal()"></div>
      <div id="modal" class="modal hidden">
        <div class="modal-header">
          <h2 id="modal-title"></h2>
          <button class="btn-icon" onclick="App.closeModal()"><i data-feather="x"></i></button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>

      <!-- Toast Container -->
      <div id="toast-container" class="toast-container"></div>
    `;
    feather.replace();
  }

  // ── Global Search ──────────────────────────────────────────────
  let searchTimeout;
  function globalSearch(query) {
    clearTimeout(searchTimeout);
    if (query.length < 2) return;
    searchTimeout = setTimeout(async () => {
      const res = await API.getLeads({ search: query });
      if (res.ok && res.leads?.length) {
        navigate('leads');
        Leads.render(res.leads);
      }
    }, 400);
  }

  // ── Init ───────────────────────────────────────────────────────
  function init() {
    if (!Auth.isLoggedIn()) {
      Auth.showLoginScreen();
      return;
    }
    Auth.hideLoginScreen();
    buildShell();
    const hash = window.location.hash.slice(1);
    navigate(views[hash] ? hash : 'dashboard');
  }

  return {
    init, navigate, toast, openModal, closeModal, confirm,
    openPanel, closePanel, toggleSidebar, globalSearch,
    getCurrentView: () => currentView,
    getMainView: () => document.getElementById('main-view')
  };
})();

// Boot
document.addEventListener('DOMContentLoaded', App.init);
window.addEventListener('hashchange', () => {
  const hash = window.location.hash.slice(1);
  if (hash) App.navigate(hash);
});
  </script>
  <!-- Auth UI Logic -->
  <script>
    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
      });
      document.getElementById('login-form').classList.toggle('active', tab === 'login');
      document.getElementById('register-form').classList.toggle('active', tab === 'register');
      document.querySelectorAll('.auth-error').forEach(e => e.textContent = '');
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      if (!email || !password) { errEl.textContent = 'Email and password are required'; return; }

      btn.disabled = true; btn.textContent = 'Signing in...';
      errEl.textContent = '';

      try {
        const res = await Auth.login(email, password);
        if (res.ok) {
          Auth.hideLoginScreen();
          App.init();
        } else {
          errEl.textContent = res.error || 'Login failed';
        }
      } catch (err) {
        errEl.textContent = 'Connection error. Check your network.';
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }

    async function handleRegister() {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const errEl = document.getElementById('reg-error');
      const btn = document.getElementById('reg-btn');

      if (!name || !email || !password) { errEl.textContent = 'All fields are required'; return; }
      if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters'; return; }

      btn.disabled = true; btn.textContent = 'Creating account...';
      errEl.textContent = '';

      try {
        const res = await Auth.register(name, email, password);
        if (res.ok) {
          // Auto-login after registration
          const loginRes = await Auth.login(email, password);
          if (loginRes.ok) {
            Auth.hideLoginScreen();
            App.init();
          } else {
            errEl.textContent = 'Account created! Please sign in.';
            switchAuthTab('login');
          }
        } else {
          errEl.textContent = res.error || 'Registration failed';
        }
      } catch (err) {
        errEl.textContent = 'Connection error. Check your network.';
      } finally {
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    }

    // Enter key support
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('login-form').classList.contains('active')) handleLogin();
      else handleRegister();
    });
  </script>
</body>
</html>
